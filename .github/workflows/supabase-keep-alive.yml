name: Supabase Keep Alive

on:
  schedule:
    # Runs twice a day (04:00 and 16:00 UTC) so the free-tier project never pauses
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-keep-alive.yml'

jobs:
  ping-supabase:
    name: Ping Supabase Database & API
    runs-on: ubuntu-latest
    steps:
      - name: Execute keep-alive queries to Supabase
        env:
          DEFAULT_SUPABASE_URL: 'https://satlrnugppdesfauxzrw.supabase.co'
          DEFAULT_SUPABASE_KEY: 'sb_publishable_C2ZHLCdaqyl7m4nr3ImPLQ_c-eG27cU'
          SECRET_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          SUPABASE_URL="${SECRET_URL:-$DEFAULT_SUPABASE_URL}"
          SUPABASE_KEY="${SECRET_KEY:-$DEFAULT_SUPABASE_KEY}"

          echo "Starting Supabase keep-alive ping"
          echo "Target URL: $SUPABASE_URL"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          ping_table() {
            local table="$1"
            local select="$2"
            local status

            echo "Querying '$table' table..."
            status=$(curl -s -o "/tmp/${table}_resp.json" -w "%{http_code}" \
              --retry 3 --retry-delay 5 --max-time 20 \
              -X GET "${SUPABASE_URL}/rest/v1/${table}?select=${select}&limit=2" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}")

            echo "Status: $status | Response: $(cat "/tmp/${table}_resp.json")"
            if [ "$status" -ne 200 ]; then
              echo "ERROR: failed querying '$table' (HTTP $status)"
              exit 1
            fi
          }

          ping_table "cards" "id,name,set"
          ping_table "news" "id,title"
          ping_table "tournaments" "id,title"

          echo "All queries succeeded. Supabase database is active."
