name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 3 days at 12:00 UTC (prevents Supabase 7-day inactivity pause)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase REST API
        run: |
          echo "Sending keep-alive ping to Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhdGxybnVncHBkZXNmYXV4enJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzE0NDQsImV4cCI6MjA5NjYwNzQ0NH0.L2g1dhmNJfwg7_UjcX7642JSu6umvrFTbCyRltlleZs' }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhdGxybnVncHBkZXNmYXV4enJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzE0NDQsImV4cCI6MjA5NjYwNzQ0NH0.L2g1dhmNJfwg7_UjcX7642JSu6umvrFTbCyRltlleZs' }}" \
            "https://satlrnugppdesfauxzrw.supabase.co/rest/v1/cards?select=id&limit=1")
          
          echo "Supabase responded with HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 206 ]; then
            echo "✅ Supabase project is active and alive!"
          else
            echo "⚠️ Warning: unexpected HTTP response $HTTP_STATUS"
            exit 1
          fi
